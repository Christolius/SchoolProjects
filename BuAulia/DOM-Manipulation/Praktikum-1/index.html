<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Praktikum 1</title>
    </head>
    <body>
        <h1 id="judul">Aku Belum Berubah</h1>
        <button id="btnUbah">Ubah Teks</button>
        <button id="btnWarna">Ubah Warna</button>
        <button id="btnUkuran" >Ubah Ukuran</button>
        <button id="btnReset"><b>Reset</b></button>
        <script>
            const judul = document.querySelector("#judul");
            const btnUbah = document.querySelector("#btnUbah");
            const btnWarna = document.querySelector("#btnWarna");
            const btnUkuran = document.querySelector("#btnUkuran")
            btnUbah.addEventListener('click', () => {
                judul.textContent = "Aku Sudah Berubah!";
            });

            btnWarna.addEventListener('click', () => {
                judul.style.color = "red";
            });

            btnUkuran.addEventListener('click', () => {
                judul.style['font-size'] = "50px";
            })

            btnReset.addEventListener('click', () => {
                judul.textContent = "Aku Belum Berubah";
                judul.style.color = "";
                judul.style['font-size'] = "";
            })
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator BMI</title>
    <style>
        body {
            font-family: Arial;
            max-width: 350px;
            margin: 40px auto;
        }
        input {
            display: block;
            margin: 10px 0;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        #hasil {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Kalkulator BMI</h2>
    <input type="number" id="berat" placeholder="Berat badan (kg)">
    <input type="number" id="tinggi" placeholder="Tinggi badan (cm)">
    <button id="btnHitung">Hitung</button>
    <div id="hasil"></div>

    <script>
        const berat = document.querySelector("#berat");
        const tinggi = document.querySelector("#tinggi");
        const btnHitung = document.querySelector("#btnHitung");
        const hasil = document.querySelector("#hasil");

        btnHitung.addEventListener("click", () => {
            const kg = Number(berat.value);
            const m = Number(tinggi.value) / 100;

            if (kg <= 0 || m <= 0){
                hasil.textContent = "Isi berat dan tinggi dengan benar!";
                hasil.style.color = "red";
                return;
            }

            const bmi = kg / Math.pow(m,2);
            let kategori = '';
            let warna = '';

            if (bmi < 18.5){
                kategori = "Kurus";
                warna = "blue";
            } else if (bmi < 25) {
                kategori = "Normal";
                warna = "green";
            } else if (bmi < 30) {
                kategori = "Gemuk";
                warna = "orange";
            } else {
                kategori = "Obesitas";
                warna = "red";
            }
            hasil.textContent = `BMI: ${bmi.toFixed(2)} (${kategori})`;
            hasil.style.color = warna;
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Praktikum Form</title>
    </head>
    <body>
        <h1>Form Pendaftaran SPMB</h1>
        <hr>
        <form>
            <table>
                <tr>
                    <td><label>Nama Lengkap</label></td>
                    <td>:</td>
                    <td><input type="text" required placeholder="Masukkan nama lengkap"></td>
                </tr>
                <tr>
                    <td><label>NIK</label></td>
                    <td>:</td>
                    <td><input type="number" required placeholder="Masukkan NIK"></td>
                </tr>
                <tr>
                    <td><label>Email</label></td>
                    <td>:</td>
                    <td><input type="email" required placeholder="Masukkan email"></td>
                </tr>
                <tr>
                    <td><label>Password</label></td>
                    <td>:</td>
                    <td><input type="password" required></td>
                </tr>
                <tr>
                    <td><label>Alamat</label></td>
                    <td>:</td>
                    <td><textarea type="text" required placeholder="Masukkan alamat"></textarea></td>
                </tr>
                <tr>
                    <td><label>Tanggal Lahir</label></td>
                    <td>:</td>
                    <td><input type="date" required></td>
                </tr>
                <tr>
                    <td><labe>Jenis Kelamin</labe></td>
                    <td>:</td>
                    <td><input type="radio" name="jenisKelamin" required>Laki-Laki <br> <input type="radio" name="jenisKelamin" required>Perempuan</td>
                </tr>
                <tr>
                    <td><label>Mata Pelajaran yg disukai</label></td>
                    <td>:</td>
                    <td>
                        <input type="checkbox" name="mapel">Fisika <br>
                        <input type="checkbox" name="mapel">B Inggris <br>
                        <input type="checkbox" name="mapel">B Indonesia <br>
                        <input type="checkbox" name="mapel">Matematika 
                    </td>
                </tr>
                <tr>
                    <td><label>Jurusan</label></td>
                    <td>:</td>
                    <td>
                        <select name="jurusan" required>
                            <option value="RPL">RPL</option>
                            <option value="TKJ">TKJ</option>
                            <option value="PG">PG</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label>Upload Foto</label></td>
                    <td>:</td>
                    <td><input type="file"></td>
                </tr>
            </table>
            <hr><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </body>
</html>
